{% extends 'base.html' %}
{% block content %}

<nav class="mb-3">
  <div style="background:#e6dfd5; padding:10px; border-radius:10px;">
    <a href="/" style="color:#6b5e53; text-decoration:none;">Home</a> /
    <span style="color:#8b6f47;">Login</span>
  </div>
</nav>

<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4">

            <h3 class="text-center mb-4" style="color:#6b5e53;">
                <i class="bi bi-person-circle"></i> Login
            </h3>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    {{ form.username }}
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    {{ form.password }}
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-2">
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </button>
            </form>

            <div class="text-center mt-2">
                <small>Belum punya akun?</small><br>
                <a href="/register/" class="btn btn-outline-secondary btn-sm mt-2">
                    Daftar
                </a>
            </div>

        </div>
    </div>
</div>

{% endblock %}
