<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Raccoon City</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    body {
      background-color: #F8F4EF;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    .navbar {
      background-color: #6F4E37 !important;
    }

    .navbar-brand {
      font-weight: bold;
      font-size: 1.8rem;
      color: white !important;
      letter-spacing: 1px;
    }

    .card {
      border-radius: 18px;
      background-color: white;
      border: none;
      box-shadow: 0 4px 15px rgba(111, 78, 55, 0.12);
    }

    .btn-pink {
      background-color: #A67C52;
      border: none;
      color: white;
      font-weight: 500;
      border-radius: 10px;
    }

    .btn-pink:hover {
      background-color: #8B6A47;
      color: white;
    }

    .btn-light {
      border-radius: 10px;
      background-color: #EFE5DA;
      border: none;
    }

    .btn-light:hover {
      background-color: #E4D5C3;
    }

    .spa-container {
      min-height: calc(100vh - 80px);
    }

    .welcome-title {
      color: #6F4E37;
      font-weight: bold;
    }

    .soft-box {
      background-color: #DCC5B2;
      border-radius: 15px;
      padding: 15px;
    }

    .alert-success {
      background-color: #E8F3EA;
      border: none;
      border-radius: 12px;
    }

    @media (max-width: 768px) {
      .navbar-brand {
        font-size: 1.4rem;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container">

      <a class="navbar-brand" href="#dashboard">
        Raccoon City
      </a>

      <div id="nav-menu" class="ms-auto"></div>

    </div>
  </nav>

  <!-- SPA CONTENT -->
  <main
    class="container mt-4 spa-container"
    id="app-content">
  </main>

  <!-- REPORT MODAL -->
  <div
    class="modal fade"
    id="reportModal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog modal-lg">

      <div class="modal-content">

        <div class="modal-header">

          <h5
            class="modal-title"
            id="modalTitle">
            Buat Laporan Baru
          </h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal">
          </button>

        </div>

        <div class="modal-body">

          <form id="reportForm">

            <div class="mb-3">

              <label class="form-label">
                Judul
              </label>

              <input
                type="text"
                id="title"
                class="form-control"
                required>

            </div>

            <div class="mb-3">

              <label class="form-label">
                Kategori
              </label>

              <input
                type="text"
                id="category"
                class="form-control"
                required>

            </div>

            <div class="mb-3">

              <label class="form-label">
                Deskripsi
              </label>

              <textarea
                id="description"
                class="form-control"
                rows="4"
                required></textarea>

            </div>

            <div class="mb-3">

              <label class="form-label">
                Lokasi
              </label>

              <input
                type="text"
                id="location"
                class="form-control"
                required>

            </div>

          </form>

        </div>

        <div class="modal-footer">

          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal">

            Batal

          </button>

          <button
            type="button"
            id="btnSubmit"
            class="btn btn-success">

            Simpan Draft

          </button>

        </div>

      </div>

    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Project JS -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>

</body>
</html>
