<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% block title %}Raccoon City{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

<style>
    body {
        background-color: #f5f1ea;
        font-family: 'Segoe UI', sans-serif;
    }

    /* ================= NAVBAR ================= */
    .navbar {
        background-color: #d8cfc4 !important;
    }

    .navbar-brand {
        font-weight: bold;
        color: #4e463f !important;
    }

    .nav-link {
        color: #4e463f !important;
        font-weight: 500;
    }

    .nav-link:hover {
        color: #8b7d6b !important;
    }

    .navbar-toggler {
        border: none;
    }

    .navbar-toggler-icon {
        filter: invert(30%);
    }

    /* ================= BUTTON ================= */
    .btn-primary {
        background-color: #c8b6a6;
        border: none;
        color: #3e3a37;
    }

    .btn-primary:hover {
        background-color: #b7a391;
        transform: scale(1.05);
    }

    .btn-success {
        background-color: #a3b18a;
        border: none;
    }

    .btn-success:hover {
        background-color: #8f9e76;
        transform: scale(1.05);
    }

    .btn-danger {
        background-color: #d6a77a;
        border: none;
    }

    .btn-danger:hover {
        background-color: #c89563;
        transform: scale(1.05);
    }

    .btn-warning:hover,
    .btn-info:hover {
        transform: scale(1.05);
    }

    /* ================= CARD ================= */
    .card {
        border-radius: 15px;
        background-color: #ffffff;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    /* ================= TABLE ================= */
    .custom-table {
        background-color: #ffffff;
        border-radius: 12px;
        overflow: hidden;
    }

    /* HEADER COKLAT AESTHETIC */
    .custom-table thead,
    .custom-table thead tr,
    .custom-table thead th {
        background: linear-gradient(135deg, #c8b6a6, #b7a391) !important;
        color: #3e3a37 !important;
    }

    .custom-table th {
        font-weight: 600;
        letter-spacing: 0.5px;
        padding: 12px;
    }

    .custom-table tbody tr:nth-child(even) {
        background-color: #f5f1ea !important;
    }

    .custom-table tbody tr:nth-child(odd) {
        background-color: #ffffff !important;
    }

    .custom-table tbody tr:hover {
        background-color: #e6dfd5 !important;
        transition: 0.25s ease;
    }

    .custom-table td {
        color: #4e463f;
    }

    /* ================= BADGE ================= */
    .badge.bg-secondary { background-color: #e3bcce !important; } /* reported */
    .badge.bg-primary { background-color: #a0c4ff !important; } /* verified pastel */
    .badge.bg-warning { background-color: #ffe066 !important; color: black; } /* progress pastel */
    .badge.bg-success { background-color: #d6d3d1 !important; color: #5f5b57; } /* resolved abu */
    /* ================= ALERT ================= */
    .alert-success {
        background-color: #e6dfd5;
        border: none;
        color: #4e463f;
    }
</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg">
<div class="container">

    <a class="navbar-brand" href="/">Raccoon City</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/reports/">Reports</a></li>
            <li class="nav-item"><a class="nav-link" href="/about/">About</a></li>
            <li class="nav-item"><a class="nav-link" href="/contacts/">Contact</a></li>
        </ul>
    </div>

</div>
</nav>

<!-- ================= ALERT ================= -->
<div class="container mt-3">
{% if messages %}
    {% for message in messages %}
        <div class="alert alert-success alert-dismissible fade show">
            {{ message }}
            <button class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
{% endif %}
</div>

<!-- ================= CONTENT ================= -->
<div class="container mt-4">
{% block content %}
{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
